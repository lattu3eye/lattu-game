<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lattu Spinning Top Game</title>
    <style>
        body { margin: 0; }
        canvas { display: block; margin: auto; background: #eee; }
    </style>
</head>
<body>
    <canvas id="arena"></canvas>
    <script>
        const canvas = document.getElementById('arena');
        const ctx = canvas.getContext('2d');
        const tops = []; // Array to hold the tops
        const audio = new (window.AudioContext || window.webkitAudioContext)(); // Web Audio API setup
        let gameState = 'menu'; // Game states: menu, playing, gameover

        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Lattu {
            constructor(x, y, angle, radius) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.radius = radius;
                this.speed = 0;
                this.spin = 0;
                this.gravity = 0.5;
                this.friction = 0.99;
                this.spinDecay = 0.98;
                this.isThrown = false;
            }

            update() {
                if (this.isThrown) {
                    this.speed *= this.friction;
                    this.spin *= this.spinDecay;
                    this.y += this.gravity;  
                    this.angle += this.spin;
                    if (this.speed < 0.1) this.isThrown = false;  
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'blue';
                ctx.fill();
                ctx.restore();
            }
        }

        function launchLattu(x, y) {
            const lattu = new Lattu(x, y, 0, 20);
            lattu.speed = 5;
            lattu.spin = 0.1;
            lattu.isThrown = true;
            tops.push(lattu);
        }

        canvas.addEventListener('mousedown', (e) => {
            launchLattu(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            launchLattu(touch.clientX, touch.clientY);
        });

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            tops.forEach(top => top.update());
            tops.forEach(top => top.draw());
            requestAnimationFrame(update);
        }

        update();  // Start the animation loop
    </script>
</body>
</html>
